<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Connect - Aktivitetsanalyse</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --garmin-dark: #12161f;
            --garmin-card: #1c2230;
            --garmin-blue: #007acc;
            --garmin-cyan: #00c1d6;
            --garmin-text: #e2e8f0;
            --garmin-text-muted: #94a3b8;
            --garmin-border: #2a3447;
            --garmin-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--garmin-dark);
            color: var(--garmin-text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--garmin-card); padding: 15px 20px;
            border-radius: 6px; border-bottom: 3px solid var(--garmin-blue);
        }
        .back-btn {
            color: var(--garmin-cyan); text-decoration: none; font-weight: bold; font-size: 0.9rem;
        }
        .back-btn:hover { text-decoration: underline; }
        .title { font-size: 1.1rem; font-weight: 600; color: #fff; }

        .card {
            background-color: var(--garmin-card); border-radius: 6px; padding: 20px;
            border: 1px solid var(--garmin-border);
        }
        .card-header { font-size: 1rem; color: #fff; font-weight: 600; margin-bottom: 15px; text-transform: uppercase; }
        
        .chart-wrapper {
            position: relative; height: 350px; width: 100%;
            background-color: #000000; border-radius: 4px; padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <a href="/" class="back-btn">← Tilbage til Dashboard</a>
            <div class="title" id="activityTitle">Henter aktivitet...</div>
        </div>

        <div class="card">
            <div class="card-header">Puls</div>
            <div class="chart-wrapper">
                <canvas id="heartRateChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        function formatDuration(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            if (hrs > 0) {
                return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        async function loadActivityData() {
            const urlParams = new URLSearchParams(window.location.search);
            const dateStr = urlParams.get('date');

            if (!dateStr) {
                document.getElementById('activityTitle').textContent = 'Ingen dato valgt';
                return;
            }

            try {
                const res = await fetch(`/api/activity/${dateStr}`);
                if (!res.ok) throw new Error('Kunne ikke hente aktivitet');
                
                const data = await res.json();
                document.getElementById('activityTitle').textContent = `${data.title} (${dateStr})`;

                const samples = data.heart_rate_samples || [];
                
                // Hvis der ikke er samples, falder vi tilbage på en simpel visning
                let labels = [];
                let hrData = [];
                let avgHr = data.avg_hr || 145;

                if (samples.length > 0) {
                    labels = samples.map(s => formatDuration(s.time));
                    hrData = samples.map(s => s.hr);
                } else {
                    // Fallback hvis Garmin API ikke returnerede tids-streams for denne tur
                    labels = ['0:00', '10:00', '20:00', '30:00', '40:00', '50:00', '1:00:00'];
                    hrData = [95, 130, 142, 148, 146, 149, 148];
                }

                const ctx = document.getElementById('heartRateChart').getContext('2d');
                
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Puls',
                                data: hrData,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.85)',
                                fill: true,
                                tension: 0.2,
                                borderWidth: 1,
                                pointRadius: 0
                            },
                            {
                                label: 'Gennemsnitlig puls',
                                data: new Array(labels.length).fill(avgHr),
                                borderColor: '#ffffff',
                                borderStyle: 'solid',
                                borderWidth: 1.5,
                                fill: false,
                                pointRadius: 0
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                min: 90,
                                max: 190,
                                grid: { color: '#2a3447' },
                                ticks: { color: '#94a3b8', stepSize: 20 }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { 
                                    color: '#94a3b8',
                                    maxTicksLimit: 10
                                }
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (item) => ` Puls: ${item.raw} bpm`
                                }
                            }
                        }
                    }
                });

            } catch (e) {
                console.error(e);
                document.getElementById('activityTitle').textContent = 'Fejl ved indlæsning af data';
            }
        }

        loadActivityData();
    </script>
</body>
</html>
