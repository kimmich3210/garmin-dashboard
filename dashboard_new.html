<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Workout Dashboard</title>
    <!-- Tailwind CSS til et flot og moderne udseende -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome til ikoner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-person-running text-blue-500"></i> Garmin Dashboard
            </h1>
            <div id="sync-status" class="text-sm text-gray-400">Forbinder til Garmin...</div>
        </header>

        <!-- Træningsparathed Sektion -->
        <section class="bg-gray-800 rounded-xl p-6 mb-8 border border-gray-700 shadow-lg">
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2 text-blue-400">
                <i class="fa-solid fa-gauge-high"></i> Træningsparathed
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                <div class="bg-gray-900 p-4 rounded-lg text-center border border-gray-800">
                    <span class="text-gray-400 text-sm block">Score</span>
                    <span id="readiness-score" class="text-4xl font-bold text-green-400">-</span>
                </div>
                <div class="bg-gray-900 p-4 rounded-lg text-center border border-gray-800">
                    <span class="text-gray-400 text-sm block">Status</span>
                    <span id="readiness-status" class="text-xl font-semibold text-white">-</span>
                </div>
                <div class="bg-gray-900 p-4 rounded-lg border border-gray-800">
                    <span class="text-gray-400 text-sm block mb-1">Detaljer</span>
                    <p id="readiness-desc" class="text-sm text-gray-300">Henter data...</p>
                </div>
            </div>
        </section>

        <!-- Kalender & Styrketræning Sektion -->
        <section class="bg-gray-800 rounded-xl p-6 mb-8 border border-gray-700 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold flex items-center gap-2 text-purple-400">
                    <i class="fa-solid fa-dumbbell"></i> Styrketræning & Kalender
                </h2>
                <div class="flex gap-2">
                    <button onclick="changeMonth(-1)" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="current-month-year" class="font-semibold px-2 py-1">Juli 2026</span>
                    <button onclick="changeMonth(1)" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- Kalender Grid -->
            <div class="grid grid-cols-7 gap-2 text-center text-sm mb-2 text-gray-400 font-semibold">
                <div>Man</div><div>Tir</div><div>Ons</div><div>Tor</div><div>Fre</div><div>Lør</div><div>Søn</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-2">
                <!-- Genereres dynamisk via JavaScript -->
            </div>
        </section>

    </div>

    <!-- Modal til Styrketræning -->
    <div id="strength-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-md w-full shadow-2xl">
            <h3 id="modal-date-title" class="text-lg font-bold mb-4 text-purple-400">Registrer Styrketræning</h3>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-1">Noter / Øvelser:</label>
                <textarea id="strength-notes" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white text-sm focus:outline-none focus:border-purple-500" placeholder="F.eks. Bænkpres 3x10 (80kg), Squat..."></textarea>
            </div>

            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm font-semibold">Annuller</button>
                <button onclick="saveCurrentStrength()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded text-sm font-semibold">Gem Træning</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        let currentDate = new Date(2026, 6, 30); // 30. juli 2026
        let selectedDateStr = "";

        // Indlæs data ved opstart
        document.addEventListener("DOMContentLoaded", () => {
            loadTrainingReadiness();
            renderCalendar();
        });

        // Hent Træningsparathed fra Python Backend (sender seneste styrke-dato med)
        async function loadTrainingReadiness() {
            try {
                const workouts = JSON.parse(localStorage.getItem('strength_workouts') || '{}');
                const dates = Object.keys(workouts).sort();
                let latestDate = dates.length > 0 ? dates[dates.length - 1] : '';

                const response = await fetch(`/api/training/readiness?latest_strength_date=${encodeURIComponent(latestDate)}`);
                const data = await response.json();

                document.getElementById('readiness-score').innerText = data.score;
                document.getElementById('readiness-status').innerText = data.status;
                document.getElementById('readiness-desc').innerText = data.description;
                document.getElementById('sync-status').innerText = "Forbundet til Garmin";
            } catch (e) {
                console.error("Fejl ved hentning af parathed:", e);
                document.getElementById('sync-status').innerText = "Kunne ikke hente Garmin-data";
            }
        }

        // Kalender og Lokal Lagring
        function loadStrengthWorkouts() {
            try {
                return JSON.parse(localStorage.getItem('strength_workouts') || '{}');
            } catch (e) {
                return {};
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = "";

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Sæt måned/år overskrift
            const monthNames = ["Januar", "Februar", "Marts", "April", "Maj", "Juni", "Juli", "August", "September", "Oktober", "November", "December"];
            document.getElementById('current-month-year').innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            // Justér for mandag som ugens første dag (0 = mandag, 6 = søndag)
            let startDay = firstDay.getDay() - 1;
            if (startDay === -1) startDay = 6;

            const workouts = loadStrengthWorkouts();

            // Tomme felter før månedens start
            for (let i = 0; i < startDay; i++) {
                const emptyDiv = document.createElement('div');
                grid.appendChild(emptyDiv);
            }

            // Dage i måneden
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dayDiv = document.createElement('div');
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                dayDiv.className = "bg-gray-900 border border-gray-800 rounded-lg p-2 min-h-[70px] flex flex-col justify-between cursor-pointer hover:border-purple-500 transition";
                
                let content = `<span class="text-xs font-bold text-gray-400">${day}</span>`;
                
                if (workouts[dateKey]) {
                    content += `<div class="bg-purple-900 text-purple-200 text-[10px] rounded px-1 py-0.5 mt-1 truncate"><i class="fa-solid fa-dumbbell"></i> Styrke</div>`;
                    dayDiv.classList.add("border-purple-700");
                }

                dayDiv.innerHTML = content;
                dayDiv.onclick = () => openModal(dateKey);
                grid.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function openModal(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modal-date-title').innerText = `Styrketræning d. ${dateStr}`;
            
            const workouts = loadStrengthWorkouts();
            document.getElementById('strength-notes').value = workouts[dateStr] || "";
            
            document.getElementById('strength-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('strength-modal').classList.add('hidden');
        }

        function saveCurrentStrength() {
            const notes = document.getElementById('strength-notes').value;
            let workouts = loadStrengthWorkouts();

            if (notes.trim() === "") {
                delete workouts[selectedDateStr];
            } else {
                workouts[selectedDateStr] = notes;
            }

            localStorage.setItem('strength_workouts', JSON.stringify(workouts));
            closeModal();
            renderCalendar();
            loadTrainingReadiness(); // Opdater parathed øjeblikkeligt med ny styrke-dato
        }
    </script>
</body>
</html>
