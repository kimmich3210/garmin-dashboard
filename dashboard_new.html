<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Løbe & Puls Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 20px;
        }
        .header { text-align: center; margin-bottom: 25px; padding: 10px; }
        .header h1 { font-size: 2.3rem; color: #00d4ff; margin-bottom: 8px; }
        .header p { color: #888; }

        .controls {
            display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap;
            background: #1a1a1a; padding: 15px 20px; border-radius: 8px;
            margin: 0 auto 30px; max-width: 900px; border: 1px solid #333;
        }
        .sync-status { display: inline-flex; align-items: center; gap: 10px; }
        .sync-indicator { width: 10px; height: 10px; border-radius: 50%; }
        .sync-indicator.active { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
        .sync-indicator.inactive { background: #f87171; }
        .sync-info { font-size: 0.85rem; color: #888; }

        .sync-btn {
            background: #00d4ff; color: #0f0f0f; border: none;
            padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold;
            font-size: 0.9rem; transition: background 0.2s;
        }
        .sync-btn:hover { background: #00a8cc; }
        .sync-btn:disabled { background: #555; cursor: not-allowed; }

        .feedback-box {
            max-width: 900px; margin: 0 auto 30px; background: #1a2332;
            border: 1px solid #2563eb; border-radius: 10px; padding: 20px;
        }
        .feedback-box h3 { color: #60a5fa; margin-bottom: 10px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .feedback-box p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; margin-bottom: 8px; }
        .feedback-box ul { list-style: none; padding-left: 0; margin-top: 10px; }
        .feedback-box li { color: #94a3b8; font-size: 0.9rem; margin-bottom: 4px; }

        .section { margin-bottom: 40px; max-width: 900px; margin-left: auto; margin-right: auto; }
        .chart-container {
            background: #1a1a1a; border-radius: 10px; padding: 20px; border: 1px solid #333;
            margin-bottom: 25px;
        }
        .chart-container h3 { color: #fff; margin-bottom: 15px; font-size: 1.1rem; }
        .chart-wrapper { position: relative; height: 350px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏃 Garmin Løbe & Sundheds-Dashboard</h1>
        <p>Mål: Pace under 5:00 min/km | MAF Puls under 155 | 10+ km</p>
    </div>

    <div class="controls">
        <div class="sync-status">
            <div class="sync-indicator" id="syncIndicator"></div>
            <div class="sync-info">
                <div id="syncStatusText">Checking...</div>
                <div id="lastSyncText"></div>
            </div>
            <button class="sync-btn" id="syncBtn" onclick="triggerSync()">Sync Now</button>
        </div>
    </div>

    <!-- Automated Feedback Section -->
    <div class="feedback-box" id="feedbackContainer">
        <h3>🤖 Automatisk Træner-Feedback (Sidste 30 Dage)</h3>
        <p id="feedbackSummary">Henter data og analyserer træning...</p>
        <ul id="feedbackDetails"></ul>
    </div>

    <!-- Running Pace 30 Days Section -->
    <div class="section">
        <div class="chart-container">
            <h3>📈 Løbe-Pace de sidste 30 dage (min/km)</h3>
            <div class="chart-wrapper"><canvas id="pace30Chart"></canvas></div>
        </div>

        <div class="chart-container">
            <h3>❤️ Hvilepuls (Sidste 14 Dage)</h3>
            <div class="chart-wrapper"><canvas id="rhrChart"></canvas></div>
        </div>
    </div>

    <script>
        Chart.defaults.color = '#888';
        Chart.defaults.borderColor = '#333';

        let rhrChart, pace30Chart;

        function formatPace(m) {
            if (!m) return '--';
            const mins = Math.floor(m), secs = Math.round((m - mins) * 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function loadSyncStatus() {
            try {
                const res = await fetch('/api/sync/status');
                const data = await res.json();
                const indicator = document.getElementById('syncIndicator');
                const statusText = document.getElementById('syncStatusText');
                const lastSync = document.getElementById('lastSyncText');
                const btn = document.getElementById('syncBtn');

                if (data.auto_sync_enabled) {
                    indicator.className = 'sync-indicator active';
                    statusText.textContent = `Auto-sync every ${data.sync_interval_hours}h`;
                    btn.style.display = 'inline-block';
                } else {
                    indicator.className = 'sync-indicator inactive';
                    statusText.textContent = 'Auto-sync disabled';
                    btn.style.display = 'none';
                }

                if (data.last_sync) {
                    const d = new Date(data.last_sync);
                    lastSync.textContent = `Sidst synkroniseret: ${d.toLocaleString()}`;
                }
            } catch (e) {
                console.error('Failed to load sync status', e);
            }
        }

        async function loadFeedback() {
            try {
                const res = await fetch('/api/running/feedback');
                const data = await res.json();
                document.getElementById('feedbackSummary').textContent = data.summary;
                const detailsList = document.getElementById('feedbackDetails');
                detailsList.innerHTML = data.details.map(d => `<li>${d}</li>`).join('');
            } catch (e) {
                console.error('Failed to load feedback', e);
            }
        }

        async function triggerSync() {
            const btn = document.getElementById('syncBtn');
            btn.textContent = 'Synkroniserer...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/sync/now', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                await loadAllData();
            } catch (e) {
                alert('Sync fejlede: ' + e.message);
            } finally {
                btn.textContent = 'Sync Now';
                btn.disabled = false;
                loadSyncStatus();
            }
        }

        async function loadPace30Chart() {
            try {
                const res = await fetch('/api/running/pace-30days');
                const data = await res.json();
                const ctx = document.getElementById('pace30Chart').getContext('2d');
                if (pace30Chart) pace30Chart.destroy();

                pace30Chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => `${d.date.split('T')[0]} (${d.title || 'Løb'})`),
                        datasets: [{
                            label: 'Gennemsnitlig Pace (min/km)',
                            data: data.map(d => d.avg_pace_min_km),
                            borderColor: '#00d4ff',
                            backgroundColor: 'rgba(0, 212, 255, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                reverse: true,
                                title: { display: true, text: 'Pace (min/km)' },
                                ticks: { callback: v => formatPace(v) }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: ctx => `Pace: ${formatPace(ctx.raw)} min/km`
                                }
                            }
                        }
                    }
                });
            } catch (e) {
                console.error('Failed to load pace chart', e);
            }
        }

        async function loadRHRChart() {
            try {
                const res = await fetch('/api/health/resting-hr');
                const data = await res.json();
                const ctx = document.getElementById('rhrChart').getContext('2d');
                if (rhrChart) rhrChart.destroy();
                
                rhrChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.date),
                        datasets: [{
                            label: 'Hvilepuls (bpm)',
                            data: data.map(d => d.resting_hr),
                            borderColor: '#f87171',
                            backgroundColor: 'rgba(248, 113, 113, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: false, title: { display: true, text: 'BPM' } }
                        }
                    }
                });
            } catch (e) {
                console.error('Failed to load RHR chart', e);
            }
        }

        async function loadAllData() {
            await Promise.all([
                loadSyncStatus(),
                loadFeedback(),
                loadPace30Chart(),
                loadRHRChart()
            ]);
        }

        loadAllData();
    </script>
</body>
</html>
