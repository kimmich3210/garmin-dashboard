<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivitetsdetaljer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Tilbage-knap -->
        <a href="/" class="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 mb-6 transition">
            <i class="fa-solid fa-arrow-left"></span> Tilbage til Dashboard
        </a>

        <!-- Aktivitets Header -->
        <div class="bg-gray-800 rounded-xl p-6 mb-8 border border-gray-700 shadow-lg">
            <h1 id="act-title" class="text-2xl font-bold mb-2 flex items-center gap-2 text-white">
                <i class="fa-solid fa-person-running text-blue-500"></i> <span id="title-text">Henter aktivitet...</span>
            </h1>
            <p id="act-date-location" class="text-gray-400 text-sm mb-4">Henter dato og sted...</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 pt-4 border-t border-gray-700">
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
                    <span class="text-gray-400 text-xs block">Distanse</span>
                    <span id="act-distance" class="text-xl font-bold text-white">-</span>
                </div>
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
                    <span class="text-gray-400 text-xs block">Tid</span>
                    <span id="act-duration" class="text-xl font-bold text-white">-</span>
                </div>
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
                    <span class="text-gray-400 text-xs block">Gns. Pace</span>
                    <span id="act-pace" class="text-xl font-bold text-white">-</span>
                </div>
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
                    <span class="text-gray-400 text-xs block">Gns. Puls</span>
                    <span id="act-hr" class="text-xl font-bold text-white">-</span>
                </div>
            </div>
        </div>

        <!-- Kilometer Splits Sektion -->
        <section class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-blue-400">
                <i class="fa-solid fa-chart-line"></i> Kilometer Splits
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="py-2 px-3">Km</th>
                            <th class="py-2 px-3">Tid</th>
                            <th class="py-2 px-3">Pace</th>
                            <th class="py-2 px-3">Puls</th>
                        </tr>
                    </thead>
                    <tbody id="splits-table-body" class="divide-y divide-gray-700 text-sm">
                        <tr>
                            <td colspan="4" class="py-4 text-center text-gray-400">Henter splits...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- JavaScript til at hente data baseret på dato fra URL -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const dateStr = urlParams.get('date');

            if (dateStr) {
                loadActivityData(dateStr);
            } else {
                document.getElementById('title-text').innerText = "Ingen dato valgt";
            }
        });

        async function loadActivityData(dateStr) {
            try {
                const response = await fetch(`/api/activity/${dateStr}`);
                if (!response.ok) throw new Error("Kunne ikke hente aktivitet");
                
                const data = await response.json();

                document.getElementById('title-text').innerText = data.title;
                document.getElementById('act-date-location').innerText = `${new Date(data.date).toLocaleDateString('da-DK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} • Vallensbæk`;
                document.getElementById('act-distance').innerText = `${(data.distance / 1000).toFixed(2)} km`;
                document.getElementById('act-duration').innerText = `${data.duration_minutes.toFixed(1)} min`;
                document.getElementById('act-pace').innerText = `${data.avg_pace_minutes.toFixed(2)} min/km`;
                document.getElementById('act-hr').innerText = `${data.avg_hr} bpm`;

                const tbody = document.getElementById('splits-table-body');
                tbody.innerHTML = "";

                if (data.splits && data.splits.length > 0) {
                    data.splits.forEach(split => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-750">
                                <td class="py-2 px-3 font-semibold">${split.km}</td>
                                <td class="py-2 px-3">${split.duration_minutes.toFixed(2)} min</td>
                                <td class="py-2 px-3">${split.pace.toFixed(2)} min/km</td>
                                <td class="py-2 px-3">${split.hr} bpm</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-gray-400">Ingen splits tilgængelige for denne tur.</td></tr>`;
                }

            } catch (e) {
                console.error(e);
                document.getElementById('title-text').innerText = "Fejl ved indlæsning";
            }
        }
    </script>
</body>
</html>
