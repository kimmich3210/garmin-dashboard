<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Workout Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --success-color: #22c55e;
            --strava-orange: #fc4c02;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* Header med levende grøn prik og dato */
        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .live-date-badge {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.95rem; color: var(--text-muted); background: #0f172a;
            padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border-color);
        }
        .live-dot {
            width: 9px; height: 9px; background-color: var(--success-color);
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 8px var(--success-color);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--accent-color); }

        /* Kalender styling */
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-nav button { background: #0f172a; color: var(--text-color); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .calendar-day-header { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; padding-bottom: 5px; }
        .calendar-day {
            background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px;
            min-height: 50px; padding: 4px; font-size: 0.8rem; display: flex; flex-direction: column; justify-content: space-between;
        }
        .calendar-day.has-activity { border-color: var(--strava-orange); background: rgba(252, 76, 2, 0.1); cursor: pointer; }
        .calendar-day.today { border-color: var(--accent-color); font-weight: bold; }
        .activity-dot { width: 6px; height: 6px; background-color: var(--strava-orange); border-radius: 50%; margin: 2px auto 0; }

        .activity-list { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; }
        .activity-item {
            background: #0f172a; padding: 12px; border-radius: 8px;
            border: 1px solid var(--border-color); text-decoration: none; color: inherit;
            display: flex; justify-content: space-between; align-items: center;
            transition: border-color 0.2s;
        }
        .activity-item:hover { border-color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <!-- TOP HEADER MED LIVE DATO OG PRIK -->
        <div class="dashboard-header">
            <div>
                <h1>Garmin Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">Kim Brian Enhaynes Lungay</p>
            </div>
            <div class="live-date-badge" id="todayDateBadge">
                <span class="live-dot"></span>
                <span id="dateText">Indlæser dato...</span>
            </div>
        </div>

        <div class="grid">
            <!-- KALENDER VISNING -->
            <div class="card">
                <h2>Kalender</h2>
                <div class="calendar-nav">
                    <button onclick="changeMonth(-1)">&lt; Forrige</button>
                    <span id="monthYearTitle" style="font-weight: bold; color: #fff;">Måned År</span>
                    <button onclick="changeMonth(1)">Næste &gt;</button>
                </div>
                <div class="calendar-grid">
                    <div class="calendar-day-header">Man</div>
                    <div class="calendar-day-header">Tir</div>
                    <div class="calendar-day-header">Ons</div>
                    <div class="calendar-day-header">Tor</div>
                    <div class="calendar-day-header">Fre</div>
                    <div class="calendar-day-header">Lør</div>
                    <div class="calendar-day-header">Søn</div>
                </div>
                <div class="calendar-grid" id="calendarDays" style="margin-top: 4px;"></div>
            </div>

            <!-- SENESTE AKTIVITETER -->
            <div class="card">
                <h2>Seneste Aktiviteter</h2>
                <div class="activity-list" id="activityList">
                    <p style="color: var(--text-muted);">Henter aktiviteter...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Vis dags dato med levende dansk format i headeren
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const todayStr = new Date().toLocaleDateString('da-DK', options);
        const formattedDate = todayStr.charAt(0).toUpperCase() + todayStr.slice(1);
        document.getElementById('dateText').textContent = formattedDate;

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let globalActivities = [];

        async function loadDashboard() {
            try {
                const res = await fetch('/api/activities/all');
                globalActivities = await res.json();
                
                // Udfyld liste over aktiviteter
                const listEl = document.getElementById('activityList');
                listEl.innerHTML = '';

                if (globalActivities.length === 0) {
                    listEl.innerHTML = '<p style="color: var(--text-muted);">Ingen aktiviteter fundet.</p>';
                    return;
                }

                globalActivities.forEach(act => {
                    const d = new Date(act.date);
                    const dateFormatted = d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' });
                    const distKm = act.distance ? (act.distance / 1000).toFixed(2) + ' km' : '--';
                    const dStr = act.date.split('T')[0];

                    const item = document.createElement('a');
                    item.className = 'activity-item';
                    item.href = `/activity?date=${dStr}`;
                    item.innerHTML = `
                        <div>
                            <strong>${act.title || 'Løbeaktivitet'}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${dateFormatted}</div>
                        </div>
                        <div style="text-align: right; font-weight: bold;">${distKm}</div>
                    `;
                    listEl.appendChild(item);
                });

                renderCalendar();

            } catch (e) {
                console.error(e);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function renderCalendar() {
            const monthNames = ["Januar", "Februar", "Marts", "April", "Maj", "Juni", "Juli", "August", "September", "Oktober", "November", "December"];
            document.getElementById('monthYearTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7; // Mandag start
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            const calContainer = document.getElementById('calendarDays');
            calContainer.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                let emptyDiv = document.createElement('div');
                calContainer.appendChild(emptyDiv);
            }

            const now = new Date();
            const todayFormatted = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            // Map aktiviteter til datoer
            let activityMap = {};
            globalActivities.forEach(act => {
                let dStr = act.date.split('T')[0];
                activityMap[dStr] = act;
            });

            for (let day = 1; day <= totalDays; day++) {
                let dStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';

                let isToday = (dStr === todayFormatted);
                if (isToday) dayEl.classList.add('today');

                let act = activityMap[dStr];
                if (act) {
                    dayEl.classList.add('has-activity');
                    dayEl.onclick = () => window.location.href = `/activity?date=${dStr}`;
                }

                dayEl.innerHTML = `
                    <div style="font-size: 0.75rem; color: ${isToday ? 'var(--accent-color)' : 'var(--text-muted)'}">${day}</div>
                    ${act ? '<div class="activity-dot" title="Trænet på denne dag"></div>' : ''}
                `;
                calContainer.appendChild(dayEl);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
